services:
  account_manager:
    image: testproject:latest
    container_name: account_manager
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: sql-db
    volumes:
      - ./:/testproject
    deploy:
      resources:
        limits:
          memory: 512M
    command:
      - /bin/bash
      - -c
      - |
        python manage.py health_check
        python manage.py migrate --no-input
        python manage.py collectstatic --no-input
        gunicorn --bind 0.0.0.0:${PORT:-8000} --env DJANGO_SETTINGS_MODULE=testproject.settings arka.wsgi:application --log-level debug --workers=2
    restart: unless-stopped
    depends_on:
      - sql-db

  sql-db:
    image: postgres:13.1-alpine
    container_name: automl_postgres
    restart: unless-stopped
    labels:
      traefik.enable: false
    volumes:
      - postgres_testproject:/var/lib/postgresql/data
    env_file:
      - .env
    command:
      - "postgres"
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: unless-stopped
      placement:
        constraints:
          - node.labels.main == 1

  celery_worker:
    image: testproject:latest
    container_name: testproject-celery-worker
    command: sh -c "celery -A testproject worker --loglevel=info --without-mingle -Ofair --concurrency=${CELERY_CONCURRENCY:-1}"
    volumes:
       - ./:/testproject
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"


volumes:
  postgres_testproject:
